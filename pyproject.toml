[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtrace-behavior"
dynamic = ["version"]
description = "V-TRACE: continuous ethograms of animal behavior from untrimmed video"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Kunming Shi", email = "kunmings@usc.edu"},
    {name = "Guang-Wei Zhang", email = "guangwei.zhang@vcuhealth.org"},
    {name = "Can Tao"},
    {name = "Zike Wang"},
    {name = "Sonia K. Zhang"},
    {name = "Huizhong W. Tao"},
    {name = "Li I. Zhang", email = "liizhang@usc.edu"},
]
maintainers = [
    {name = "Guang-Wei Zhang", email = "guangwei.zhang@vcuhealth.org"},
    {name = "Li I. Zhang", email = "liizhang@usc.edu"},
]
requires-python = ">=3.9"
keywords = ["ethogram", "animal-behavior", "behavior-annotation", "video-analysis", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.0.1",
    "torchvision>=0.15.2",
    "decord>=0.6.0",
    "einops>=0.6.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "tqdm>=4.64.0",
    "numpy>=1.23.5",
    "opencv-python-headless>=4.6.0",
    "static-ffmpeg>=2.5",
    # Terminal UI for the `trace` session; both degrade gracefully if absent.
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/KunmingS/TRACE"
Documentation = "https://kunmings.github.io/TRACE/"
Repository = "https://github.com/KunmingS/TRACE"
Issues = "https://github.com/KunmingS/TRACE/issues"

[project.scripts]
vtrace = "vtrace.cli:main"

[tool.setuptools.dynamic]
version = {attr = "vtrace.version.__version__"}

[tool.setuptools.packages.find]
include = ["vtrace*", "tools*", "configs*"]

[tool.setuptools.package-data]
"configs" = ["**/*.py"]
"vtrace" = ["static/gui/*.html", "demo_data/**/*.csv", "demo_data/**/*.txt", "demo_data/**/*.json"]
