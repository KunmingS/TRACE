            function decodeUtf8(encoded) {
                const binary = atob(encoded.replace(/\s/g, ''));
                const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
                return new TextDecoder().decode(bytes);
            }

            const requestedRoute = new URLSearchParams(window.location.search).get('page')?.toLowerCase();
            const route = Object.prototype.hasOwnProperty.call(encodedPages, requestedRoute)
                ? requestedRoute
                : 'configuration';

            document.open();
            document.write(decodeUtf8(encodedPages[route]));
            document.close();
